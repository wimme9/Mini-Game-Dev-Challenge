<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartoon Forest: Fruit Catcher</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            /* ฉากหลังท้องฟ้าภายนอกกว้างๆ */
            background: linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 100%);
            color: white;
            font-family: 'Chakra Petch', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            background-color: transparent; /* ให้ Canvas คุมสีฉากหลัง */
            border-radius: 20px;
            /* เพิ่มเงาให้ขอบดูกล่องลอย */
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            width: 400px;
            max-width: 100%;
            height: 600px;
            border: 4px solid white;
        }

        canvas {
            display: block;
        }

        #score-board {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #2c3e50;
            font-size: 26px;
            font-weight: 700;
            pointer-events: none;
            /* สไตล์กระจกฝ้า ลอยๆ */
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
            padding: 8px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
        }

        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 23, 31, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            display: none;
            border-radius: 16px;
            z-index: 10;
        }

        #game-over h2 {
            font-size: 55px;
            margin: 0 0 10px 0;
            color: #e74c3c;
            text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(231, 76, 60, 0.5);
            animation: shake 0.5s infinite;
        }

        #game-over p {
            margin: 5px 0;
            font-size: 22px;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Chakra Petch', sans-serif;
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }

        button:hover {
            transform: scale(1.1) translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.6);
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-board">SCORE: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div id="game-over">
            <h2>💥 BOOM!</h2>
            <p>You caught a bomb!</p>
            <p style="font-size: 28px; font-weight: bold;">Final Score: <span id="final-score" style="color: #f1c40f;">0</span></p>
            <button onclick="resetGame()">PLAY AGAIN? 🔄</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');

        // ข้อมูลผู้เล่น (ตะกร้าสาน)
        let player = { x: 170, y: 500, width: 70, height: 60 };
        
        // ข้อมูลไอเทม
        let items = [];
        const goodColors = ['#ff4d4d', '#ff9f43', '#1dd1a1', '#54a0ff']; // สีสดของผลไม้
        const badColor = '#2c3e50'; // สีระเบิด
        
        let score = 0;
        let gameActive = true;
        let speedMultiplier = 1;
        let spawnTimer;
        let animationId;
        let targetX = 170;

        function updateInput(clientX) {
            const rect = canvas.getBoundingClientRect();
            let newX = clientX - rect.left - player.width / 2;
            if (newX < -10) newX = -10;
            if (newX > canvas.width - player.width + 10) newX = canvas.width - player.width + 10;
            targetX = newX;
        }

        canvas.addEventListener('mousemove', (e) => updateInput(e.clientX));
        canvas.addEventListener('touchmove', (e) => {
            updateInput(e.touches[0].clientX);
            e.preventDefault();
        }, { passive: false });

        function spawnItem() {
            if (!gameActive) return;
            
            const isBomb = Math.random() < 0.20; // 20% โอกาสเจอระเบิด
            
            items.push({
                x: 20 + Math.random() * (canvas.width - 60),
                y: -50,
                isBomb: isBomb,
                color: isBomb ? badColor : goodColors[Math.floor(Math.random() * goodColors.length)],
                radius: 18 + Math.random() * 4,
                speed: (Math.random() * 2 + 2.0) * speedMultiplier
            });

            speedMultiplier += 0.015;
            const nextSpawn = Math.random() * 500 + 400; // เกิดไวขึ้นนิดนึง
            spawnTimer = setTimeout(spawnItem, nextSpawn);
        }

        function update() {
            if (!gameActive) return;

            player.x += (targetX - player.x) * 0.25; // ตะกร้าตอบสนองไวขึ้น

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                // เช็คการชน (ปรับ Hitbox ให้แม่นขึ้น)
                let centerX = item.x + item.radius;
                let centerY = item.y + item.radius;
                
                if (centerY > player.y + 10 && 
                    centerY < player.y + player.height && 
                    centerX > player.x && 
                    centerX < player.x + player.width) {
                    
                    if (item.isBomb) {
                        endGame();
                    } else {
                        score += 10;
                        scoreElement.innerText = score;
                    }
                    items.splice(i, 1);
                } 
                else if (item.y > canvas.height + 50) {
                    items.splice(i, 1);
                }
            }
        }

        // --- ส่วนวาดกราฟิกที่ปรับปรุงใหม่ ---
        function drawScene() {
            // 1. วาดท้องฟ้าท้องฟ้า (Sky Gradient)
            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#8edbfb'); // สีฟ้าอ่อนด้านบน
            skyGrad.addColorStop(0.7, '#fff1eb'); // สีส้มชมพูระเรื่อๆ ใกล้ขอบฟ้า
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. วาดพื้นหญ้า (Grass Zone)
            ctx.fillStyle = '#7cfc00'; // สีหญ้าเขียวสด
            ctx.fillRect(0, 520, canvas.width, 80);
            
            ctx.fillStyle = '#32cd32'; // เพิ่มหญ้าสีเข้มด้านล่างมีมิติ
            ctx.fillRect(0, 540, canvas.width, 60);
        }

        function drawBasket(x, y, w, h) {
            ctx.save();
            // วาดตัวตะกร้า (Brown Basket)
            let basketGrad = ctx.createLinearGradient(x, y, x, y+h);
            basketGrad.addColorStop(0, '#de9138'); // สีตาลส้มด้านบน
            basketGrad.addColorStop(1, '#a67c52'); // สีตาลเข้มด้านล่าง
            ctx.fillStyle = basketGrad;
            ctx.beginPath();
            ctx.moveTo(x + 10, y);
            ctx.lineTo(x + w - 10, y);
            ctx.lineTo(x + w, y + h - 15);
            ctx.arcTo(x+w, y+h, x+w-20, y+h, 15);
            ctx.lineTo(x + 20, y+h);
            ctx.arcTo(x, y+h, x, y+h-20, 15);
            ctx.closePath();
            ctx.fill();

            // วาดลายสาน (Wicker Texture) ง่ายๆ
            ctx.strokeStyle = 'rgba(101, 67, 33, 0.3)';
            ctx.lineWidth = 2;
            for(let i=10; i<w; i+=15) {
                ctx.beginPath();
                ctx.moveTo(x+i, y);
                ctx.lineTo(x+i-5, y+h);
                ctx.stroke();
            }
            for(let i=10; i<h; i+=15) {
                ctx.beginPath();
                ctx.moveTo(x, y+i);
                ctx.lineTo(x+w, y+i+2);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawSphericalItem(item) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(item.x + item.radius, item.y + item.radius, item.radius, 0, Math.PI * 2);
            
            // วาดมิติแสงเงา (Radial Gradient)
            let grad = ctx.createRadialGradient(
                item.x + item.radius*0.7, item.y + item.radius*0.7, item.radius*0.1, // จุดไฮไลท์
                item.x + item.radius, item.y + item.radius, item.radius // ขอบรอบ
            );
            
            grad.addColorStop(0, '#ffffff'); // ไฮไลท์ขาวกลาง
            grad.addColorStop(0.2, item.color); // สีหลักของไอเทม
            grad.addColorStop(1, '#000000'); // ขอบดำเพิ่มมิติ
            
            ctx.fillStyle = grad;
            ctx.fill();
            
            // ถ้าเป็นระเบิด เพิ่มชนวนเล็กๆ
            if (item.isBomb) {
                ctx.fillStyle = '#654321';
                ctx.fillRect(item.x + item.radius - 2, item.y - 8, 4, 10);
            }
            
            ctx.restore();
        }

        function draw() {
            if (!gameActive) return;
            drawScene(); // วาดฉากใหม่ทุกครั้ง

            // วาดตะกร้าผู้เล่นสไตล์สาน
            drawBasket(player.x, player.y, player.width, player.height);

            // วาดไอเทมมีมิติแสงเงา
            items.forEach(item => {
                drawSphericalItem(item);
            });
        }

        function gameLoop() {
            update();
            draw();
            if (gameActive) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function endGame() {
            gameActive = false;
            clearTimeout(spawnTimer);
            cancelAnimationFrame(animationId);
            
            // วาดฉากหลังและผู้เล่นไว้ (static) ในหน้าจอจบเกม
            drawScene();
            drawBasket(player.x, player.y, player.width, player.height);

            gameOverScreen.style.display = 'flex';
            finalScoreElement.innerText = score;
        }

        function resetGame() {
            clearTimeout(spawnTimer);
            cancelAnimationFrame(animationId);
            
            score = 0;
            speedMultiplier = 1;
            scoreElement.innerText = score;
            items = [];
            targetX = 170;
            player.x = 170;
            gameActive = true;
            gameOverScreen.style.display = 'none';
            
            spawnItem();
            gameLoop();
        }

        // เริ่มเกม
        resetGame();
    </script>
</body>
</html>
