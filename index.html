    <title>สารบัญโปรเจกต์ (001 - 012)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }
        .folder-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: #2c3e50;
            font-weight: bold;
            font-size: 1.2rem;
            border: 1px solid #e2e8f0;
        }
        .folder-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            background-color: #3498db;
            color: white;
            border-color: #3498db;
        }
        .icon {
            font-size: 2rem;
            margin-bottom: 8px;
            display: block;
        }
    </style>
</head>
<body>
