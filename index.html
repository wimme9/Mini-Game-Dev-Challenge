let score = 0;
let lives = 3;
let gameOver = false;

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    physics:{
        default:'arcade',
        arcade:{gravity:{y:0},debug:false}
    },
    scene:{preload,create,update}
};

const game = new Phaser.Game(config);
let player,cursors,coins,rocks,scoreText,livesText,winText;

function preload(){
    this.load.image('bg', BG_BASE64);
    this.load.image('cat', CAT_BASE64);
    this.load.image('coin', COIN_BASE64);
    this.load.image('rock', ROCK_BASE64);
}

function create(){
    this.add.image(400,300,'bg').setDisplaySize(800,600);
    player=this.physics.add.sprite(400,520,'cat');
    player.setCollideWorldBounds(true);
    coins=this.physics.add.group();
    rocks=this.physics.add.group();
    cursors=this.input.keyboard.createCursorKeys();

    scoreText=this.add.text(20,20,'Score: 0',{font:'32px Arial',fill:'#ffffff'});
    livesText=this.add.text(20,60,'Lives: 3',{font:'32px Arial',fill:'#ff5555'});

    this.time.addEvent({delay:1000,callback:spawnCoin,callbackScope:this,loop:true});
    this.time.addEvent({delay:1200,callback:spawnRock,callbackScope:this,loop:true});

    this.physics.add.overlap(player,coins,collectCoin,null,this);
    this.physics.add.overlap(player,rocks,hitRock,null,this);
}

function update(){
    if(gameOver) return;
    player.setVelocityX(0);
    if(cursors.left.isDown) player.setVelocityX(-300);
    if(cursors.right.isDown) player.setVelocityX(300);
}

function spawnCoin(){
    if(gameOver) return;
    let x=Phaser.Math.Between(50,750);
    let coin=coins.create(x,-50,'coin');
    coin.setVelocityY(250);
}

function spawnRock(){
    if(gameOver) return;
    let x=Phaser.Math.Between(50,750);
    let rock=rocks.create(x,-50,'rock');
    rock.setVelocityY(300);
}

function collectCoin(player,coin){
    coin.destroy();
    score+=10;
    scoreText.setText('Score: '+score);
    if(score>=500){
        gameOver=true;
        winText=player.scene.add.text(250,250,'YOU WIN!',{font:'64px Arial',fill:'#00ff00'});
    }
}

function hitRock(player,rock){
    rock.destroy();
    lives--;
    livesText.setText('Lives: '+lives);
    if(lives<=0){
        gameOver=true;
        player.scene.add.text(220,250,'GAME OVER',{font:'64px Arial',fill:'#ff0000'});
    }
}
</script>
